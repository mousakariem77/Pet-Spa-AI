<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="petspaBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="55%" stop-color="#0f8b8d"/>
      <stop offset="100%" stop-color="#0b3d3f"/>
    </linearGradient>
    <linearGradient id="petspaSparkle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="petspaPaw" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ecfeff"/>
    </linearGradient>
    <filter id="petspaShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#042f2e" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Nền Squircle gradient cao cấp -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#petspaBgGrad)"/>
  
  <!-- Viền sáng vi mô -->
  <rect x="2.5" y="2.5" width="59" height="59" rx="15.5" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1"/>

  <!-- Bong bóng bọt nước Spa (thể hiện chăm sóc, tắm gội thư giãn) -->
  <circle cx="16" cy="17" r="4.2" fill="#ffffff" fill-opacity="0.2"/>
  <circle cx="14.8" cy="15.8" r="1.2" fill="#ffffff" fill-opacity="0.6"/>
  <circle cx="48" cy="46" r="3.2" fill="#ffffff" fill-opacity="0.18"/>

  <!-- Bàn chân thú cưng (Pet Paw) -->
  <g fill="url(#petspaPaw)" filter="url(#petspaShadow)">
    <!-- 4 ngón đệm -->
    <ellipse cx="20" cy="25" rx="3.8" ry="5.2" transform="rotate(-18 20 25)"/>
    <ellipse cx="28" cy="20.5" rx="4" ry="5.8"/>
    <ellipse cx="36" cy="20.5" rx="4" ry="5.8"/>
    <ellipse cx="44" cy="25" rx="3.8" ry="5.2" transform="rotate(18 44 25)"/>

    <!-- Đệm chính tạo hình giọt nước spa kết hợp trái tim yêu thương -->
    <path d="M32 29.5 C22.8 29.5 19 35.8 20.8 43.5 C22.2 48.5 27.5 49.8 32 47.2 C36.5 49.8 41.8 48.5 43.2 43.5 C45 35.8 41.2 29.5 32 29.5 Z"/>
  </g>

  <!-- Ngôi sao AI Sparkle thông minh ở góc trên -->
  <path d="M49 8 C49 12.5 52.5 14.5 56 14.5 C52.5 14.5 49 16.5 49 21 C49 16.5 45.5 14.5 42 14.5 C45.5 14.5 49 12.5 49 8 Z" fill="url(#petspaSparkle)"/>
  <circle cx="53.5" cy="8.5" r="1.3" fill="#fef08a"/>
</svg>
